

<div class="mat-elevation-z8 p-3 customcomponentheight">
    <div>
        <p class="fw-bold">Tickets by category</p>
        <button class="float-end" mat-icon-button [matMenuTriggerFor]="periodMenu">
            <span class="material-symbols-outlined">
                more_vert
                </span>
        </button>
    </div>
    
      <mat-menu #periodMenu="matMenu">
        <button mat-menu-item (click)="onPeriodChange('30')">Last 30 Days</button>
        <button mat-menu-item (click)="onPeriodChange('60')">Last 60 Days</button>
        <button mat-menu-item (click)="onPeriodChange('90')">Last 3 Months</button>
      </mat-menu>

    <ngx-charts-bar-vertical
(window:resize)="onResize($event)"
              [view]="view"
              [scheme]="colorScheme"
              [results]="dataset"
              [gradient]="gradient"
              [xAxis]="showXAxis"
              [yAxis]="showYAxis"
              [legend]="showLegend"
              [showXAxisLabel]="showXAxisLabel"
              [showYAxisLabel]="showYAxisLabel"
              [xAxisLabel]="xAxisLabel"
              [yAxisLabel]="yAxisLabel"
              (select)="onSelect($event)">
</ngx-charts-bar-vertical>
</div>
