<!-- Header Section -->
<div class="dashboard-header">
  <div class="header-content">
    <h1>
      <span class="material-symbols-outlined">business</span>
      Customers
    </h1>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="addCompany()" class="custombutton">
        <span class="material-symbols-outlined">add</span>
        Add a new customer
      </button>
    </div>
  </div>
</div>

<div class="content-section">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>  
  </mat-form-field>
  <div class="row p-3">
    <div class="export-container">
      <button mat-stroked-button color="primary" (click)="exportTable()"><span class="material-symbols-outlined">
        download
        </span> Export Excel</button>
    </div>
    <div class="mat-elevation-z8 p-0">
      <table mat-table [dataSource]="dataSource" id="tblCompanies" matSort class="mat-elevation-z8 demo-table">  
       
        <ng-container matColumnDef="id">
          <th [hidden]="true" mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td [hidden]="true" mat-cell *matCellDef="let row"> {{row.id}} </td>       
        </ng-container>  
        
        
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Customer Name </th>
          <td width="20%" mat-cell *matCellDef="let row"><span><span class="entity-avatar material-symbols-outlined" aria-hidden="true">corporate_fare</span></span> {{row.name}}</td>
        </ng-container>

        <ng-container matColumnDef="contactPerson">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Contact Person </th>
          <td width="20%" mat-cell *matCellDef="let row" class="text-center"> {{row.contactPerson}}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
          <td width="20%" mat-cell *matCellDef="let row" class="text-center"> {{row.email}}</td>
        </ng-container>     
        
        <ng-container matColumnDef="createdDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Created Date </th>
          <td width="20%" mat-cell *matCellDef="let row" class="text-center"> {{row.createdDate}} </td>
        </ng-container> 
        
        <ng-container matColumnDef="Actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td width="20%" mat-cell *matCellDef="let element" class="text-center"> 
            <button mat-mini-fab color="primary" class="me-2" (click)="editCompany(element)"><span class="material-symbols-outlined">edit</span></button>
            <button mat-mini-fab color="warn"  (click)="deleteCompany(element.id)"><span class="material-symbols-outlined">delete</span></button>
            </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
        
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
    
      <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
  </div>
</div>
